name: Mise à jour du site
on:
  schedule:
    - cron: "17 4 * * *"   # chaque jour vers 6 h, heure de Paris
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore: ["data/**"]
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  site:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Générer le site
        env:
          SITE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
        run: python build.py
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
      - name: Enregistrer l'état du jour
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/etat.json
          git diff --cached --quiet || git commit -m "État du $(date -u +%F)"
          git pull --rebase
          git push
