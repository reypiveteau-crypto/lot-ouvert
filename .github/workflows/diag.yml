name: Diagnostic données
on:
  workflow_dispatch:
  push:
    paths: ["diag.py"]
permissions:
  contents: write
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 diag.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/diag.json && git commit -m "Échantillon de diagnostic" && git pull --rebase && git push
